#Tell spring to use a different environment-specific property file corresponding to the active profile.
spring.profiles.active=@activatedProperties@

# Behind nginx (TLS terminated there): trust X-Forwarded-* from internal proxies so redirects use https
# and Spring Security sends HSTS. 'native' = Tomcat RemoteIpValve, which only trusts private/loopback addresses.
server.forward-headers-strategy=native

# Static resource chain: enables content-hashed CSS/JS URLs (see WebConfig) and the Thymeleaf URL rewriting filter.
spring.web.resources.chain.enabled=true
