    <link rel="icon" type="image/png" sizes="512x512" th:href="@{/img/favicon/android-chrome-512x512.png}">

    <link rel="stylesheet" th:href="@{/css/font-awesome/all.min.css}">

    <link rel="stylesheet" th:href="@{/css/style.css}">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "CLAI",
        "url": "https://clai.co.za",
        "logo": "https://clai.co.za/static/img/full-logo-lockup-black-50.png"
      }

  <body>
  <!-- Floating WhatsApp Button with Official Logo -->
  <div th:insert="fragments/whatsapp-float :: whatsapp-button"></div>
    
    <!--=================================
    preloader -->
    <div id="pre-loader">
      <img src="/img/pre-loader/clai-loader-black-50.svg" alt="">
    </div>
    <!--=================================
    preloader -->
    
    <!--=================================
    Header -->
    <header class="header header-sticky default">
        <div th:insert="fragments/navbar :: nav-bar"></div>
    </header>
    <!--=================================
    Header -->
    <!--=================================
    Search -->
    <div id="search">
      <button type="button" class="close">×</button>
      <form>
        <input type="search" value="" placeholder="Enter keyword">
        <button type="submit" class="btn btn-primary">Search</button>
      </form>
    </div>
    <!--=================================
    Search -->
    <!--=================================
    Contact-Info -->
    <section class="space-pt">
    </section>
    <!--=================================
    Contact-Info -->
    <!--=================================
    Contact Us -->
    <section class="space-pb">
      <div class="container">
        <div class="row">
          <div class="col-lg-5">
            <div class="message-info">
              <div class="section-title">
                <h3 class="title mb-4">Get In Touch With Us</h3>
              </div>
              <div class="feature-box feature-box-style-04 mb-4">
                <div class="feature-icon">
                  <i class="fas fa-map-marker-alt"></i>
                </div>
                <div class="feature-content">
                  <h4 class="mb-2">Address</h4>
                  <span>22 Van der Byl Avenue, Durbanville</span>
                </div>
              </div>
              <div class="feature-box feature-box-style-04 mb-4">
                <div class="feature-icon">
                  <i class="fas fa-phone"></i>
                </div>
                <div class="feature-content">
                  <h4 class="mb-2">Phone</h4>
                  <span>+27 77 370 5689</span>
                </div>
              </div>
              <div class="feature-box feature-box-style-04 mb-0">
                <div class="feature-icon">
                  <i class="far fa-envelope"></i>
                </div>
                <div class="feature-content">
                  <h4 class="mb-2">Email</h4>
                  <span> info@clai.co.za</span>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-7 mt-5 mt-lg-0">
            <div class="contact-us-form">
              <div class="section-title">
                <h3 class="title mb-4">We'd Love To Hear From You</h3>
              </div>
              <form id="contactForm" th:action="@{/email}" th:object="${emailModel}" method="post" >
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="row">
                  <!-- Full Name Field -->
                  <div class="mb-3 col-md-6">
                    <label for="fullName" ></label>
                    <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                    <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="Full Name">
                  </div>

                  <!-- Email Field -->
                  <div class="mb-3 col-md-6">
                    <label for="email"></label>
                    <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="Your Email">
                  </div>

                  <!-- Comment Field -->
                  <div class="mb-3 col-md-12">
                    <label for="comment" ></label>
                    <div class="error" th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}"></div>
                    <textarea class="form-control" id="comment" rows="3" th:field="*{comment}" placeholder="Your Message"></textarea>
                  </div>

                  <!-- Submit Button -->
                  <div class="col-md-6">
                    <div class="d-grid">
                      <button type="submit" class="btn btn-primary">Send Message</button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!--=================================
    Contact Us -->
    <!--=================================
    Map -->
    <section>
      <h2 class="m-0 p-0" style="display: none;">Map</h2>
      <div class="container-fluid">
        <div class="row">
          <div class="col-md-12 p-0">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3314.128249730655!2d18.650165275707238!3d-33.834803073239684!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1dcc571785fe5bc7%3A0xa64c4028a7d46318!2s22%20Van%20Der%20Byl%20Ave%2C%20Valmary%20Park%2C%20Cape%20Town%2C%207550!5e0!3m2!1sen!2sza!4v1736964136031!5m2!1sen!2sza" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </section>
    <!--=================================
    Map -->
    <!--=================================
    footer-->
  <section>
      <div th:insert="fragments/footer :: footer"></div>
  </section>
