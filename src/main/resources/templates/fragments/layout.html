<!DOCTYPE html>
<!--
  Shared page shell. Every page uses these three pieces, so a change here applies site-wide:

    <head th:replace="~{fragments/layout :: head('treatment')}"></head>
    <body>
      <th:block th:replace="~{fragments/layout :: page-top}"></th:block>
      ... page sections ...
      <th:block th:replace="~{fragments/layout :: page-end('treatment')}"></th:block>
    </body>

  type = 'treatment' | 'blog' | 'contact' | 'home'. It selects the plugin CSS/JS and structured data.
  SEO tags (title, description, canonical, Open Graph, Twitter) come from the model attribute `page`
  (content/pages.yml, added for every request by GlobalModelAdvice). Pages without an entry (error pages)
  fall back to the site defaults and get no canonical.
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(type)">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-81M8RGH9NY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-81M8RGH9NY');
    </script>
    <th:block th:with="title=${page?.title} ?: 'CLAI - The Science of Health, the Art of Living',
                       description=${page?.description} ?: 'At CLAI, we believe that true beauty starts with optimal skin health and overall well-being. Our approach merges state-of-the-art technology, advanced scientific research and expert knowledge to provide personalised treatments that deliver real, lasting results.',
                       url=${page != null ? site.absolute(page.path) : site.baseUrl + '/'},
                       image=${site.imageFor(page)}">
    <meta charset="utf-8">
    <meta name="author" content="giicit.co.za">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title th:text="${title}">CLAI</title>
    <meta name="description" th:content="${description}">
    <link th:if="${page != null}" rel="canonical" th:href="${url}">

    <meta property="og:site_name" content="CLAI">
    <meta property="og:locale" content="en_ZA">
    <meta property="og:type" th:content="${page != null and page.blog ? 'article' : 'website'}">
    <meta property="og:title" th:content="${title}">
    <meta property="og:description" th:content="${description}">
    <meta property="og:url" th:content="${url}">
    <meta property="og:image" th:content="${image}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" th:content="${title}">
    <meta name="twitter:description" th:content="${description}">
    <meta name="twitter:image" th:content="${image}">
    </th:block>

    <!-- Standard favicon -->
    <link rel="icon" type="image/x-icon" th:href="@{/img/favicon/favicon.ico}">

    <!-- PNG favicons -->
    <link rel="icon" type="image/png" sizes="32x32" th:href="@{/img/favicon/favicon-32x32.png}">
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/img/favicon/favicon-16x16.png}">

    <!-- Apple Touch Icon (for iPhones & iPads) -->
    <link rel="apple-touch-icon" th:href="@{/img/favicon/apple-touch-icon.png}">

    <!-- Android Chrome Icons -->
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/img/favicon/android-chrome-192x192.png}">
    <link rel="icon" type="image/png" sizes="512x512" th:href="@{/img/favicon/android-chrome-512x512.png}">

    <!-- Web App Manifest -->
    <link rel="manifest" th:href="@{/img/favicon/site.webmanifest}">

    <!-- Theme color for mobile browsers -->
    <meta name="theme-color" content="#ffffff">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link th:if="${type == 'treatment' or type == 'home'}" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@100;200;300;400&display=swap" rel="stylesheet">

    <!-- CSS Global Compulsory (Do not remove)-->
    <link rel="stylesheet" th:href="@{/css/font-awesome/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/bootstrap/bootstrap.min.css}">

    <!-- Plugin CSS: only what a page type actually uses (Phase 3, Nov 2026). The home page's review and treatment
         carousels are the only owl-carousel markup; no page uses select2, datetimepicker, slick, swiper,
         magnific-popup or animate.css (custom.js only initialises a plugin when its markup exists). -->
    <th:block th:if="${type == 'home'}">
    <link rel="stylesheet" th:href="@{/css/owl-carousel/owl.carousel.min.css}">
    </th:block>

    <!-- Template Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- Structured data (schema.org JSON-LD). Business details live here once; social links come from
         the same config as the footer. To add opening hours, add an "openingHoursSpecification" array. -->
    <script type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "MedicalBusiness",
        "@id": [[${site.absolute('/') + '#business'}]],
        "name": "CLAI",
        "alternateName": "CLAI Lifestyle Aesthetic Institute",
        "url": [[${site.absolute('/')}]],
        "logo": [[${site.absolute('/img/full-logo-lockup-black-50.png')}]],
        "image": [[${site.absolute('/img/full-logo-lockup-black-50.png')}]],
        "description": "The Science of Health, the Art of Living. Aesthetic and skin clinic in Durbanville, Cape Town.",
        "telephone": "+27 77 370 5689",
        "email": "info@clai.co.za",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "22 Van der Byl Avenue",
          "addressLocality": "Durbanville",
          "addressRegion": "Western Cape",
          "postalCode": "7550",
          "addressCountry": "ZA"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": -33.834384,
          "longitude": 18.652697
        },
        "sameAs": [[${socialLinks}]]
      }
    </script>
    <script th:if="${page != null and !page.home}" type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": [[${site.absolute('/')}]] },
          { "@type": "ListItem", "position": 2, "name": [[${page.name}]], "item": [[${site.absolute(page.path)}]] }
        ]
      }
    </script>
    <script th:if="${page != null and page.blog}" type="application/ld+json" th:inline="javascript">
      {
        "@context": "https://schema.org",
        "@type": "BlogPosting",
        "headline": [[${#strings.substringBefore(page.title, ' | ')}]],
        "description": [[${page.description}]],
        "datePublished": [[${page.datePublished}]],
        "dateModified": [[${page.lastmod}]],
        "author": { "@type": "Person", "name": [[${page.author}]] },
        "publisher": { "@id": [[${site.absolute('/') + '#business'}]] },
        "image": [[${site.imageFor(page)}]],
        "mainEntityOfPage": [[${site.absolute(page.path)}]]
      }
    </script>
</head>

<body>

<!-- Top of every page: WhatsApp button, preloader, sticky header with navbar -->
<th:block th:fragment="page-top">
  <!-- Floating WhatsApp Button with Official Logo -->
  <div th:insert="~{fragments/whatsapp-float :: whatsapp-button}"></div>

    <!--=================================
    preloader -->
    <div id="pre-loader">
      <img src="/img/pre-loader/clai-loader-black-50.svg" alt="">
    </div>

    <!--=================================
    Header -->
    <header class="header header-sticky default">
        <div th:insert="~{fragments/navbar :: nav-bar}"></div>
    </header>
</th:block>

<!-- Bottom of every page: footer, price-list modal, scripts -->
<th:block th:fragment="page-end(type)">
  <!--=================================
  footer-->
  <section>
      <div th:insert="~{fragments/footer :: footer}"></div>
  </section>

  <!--=================================
  PDF Price List (opened from the navbar "Price List" item)-->
  <div th:replace="~{fragments/pdf-modal :: pdf-modal(
    'pdfModal',
    'pdfModalLabel',
    'pdf-viewer',
    'current-page',
    'total-pages',
    '/docs/pricelist.pdf',
    'Price List'
)}"></div>

    <!--=================================
    Javascript -->
    <!-- JS Global Compulsory (Do not remove)-->
    <script th:src="@{/js/jquery-3.7.1.min.js}"></script>
    <script th:src="@{/js/popper/popper.min.js}"></script>
    <script th:src="@{/js/bootstrap/bootstrap.min.js}"></script>
    <!-- Plugins: only the home page's owl carousels (see the CSS note in head) -->
    <th:block th:if="${type == 'home'}">
    <script th:src="@{/js/owl-carousel/owl.carousel.min.js}"></script>
    </th:block>
    <!-- Template Scripts (Do not remove)-->
    <script th:src="@{/js/custom.js}"></script>
    <!-- Conversion tracking: GA4 events for bookings, WhatsApp, phone, email, contact form -->
    <script th:src="@{/js/clai-tracking.js}"></script>
</th:block>

</body>
</html>
