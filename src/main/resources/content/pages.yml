# Single source of truth for every public page's SEO data.
# Used by: the <head> (title, description, canonical, Open Graph/Twitter), structured data (breadcrumbs,
# blog posts) and the generated /sitemap.xml (SitemapController).
#
# Adding a page: add an entry here (path must match the controller mapping).
# Changing a page's content: update its lastmod (YYYY-MM-DD) so search engines re-crawl it.
# Guidelines: title <= 60 characters, "<Topic> in Durbanville | CLAI"; description <= 155 characters,
# taken from the page's own copy (no prices: they change and would drift from the treatment text).
